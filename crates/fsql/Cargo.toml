[package]
name        = "fsql"
version     = { workspace = true }
edition     = { workspace = true }
description = "Query and change the filesystem with SQL, from Rust or the fsql command"
repository  = { workspace = true }
license     = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[[bin]]
doc               = false
name              = "fsql"
path              = "src/main.rs"
required-features = ["cli"]

[[test]]
name              = "query_files"
required-features = ["cli"]

[[bench]]
harness = false
name    = "engine"

[[bench]]
harness = false
name    = "traversal"

[[bench]]
harness = false
name    = "layers"

[[bench]]
harness = false
name    = "layers_alloc"

[dependencies]
sqlparser.workspace   = true
tree-fucker.workspace = true

globset.workspace    = true
regex.workspace      = true
serde.workspace      = true
serde_json.workspace = true

clap = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace   = true
ignore.workspace      = true
jwalk.workspace       = true
stats_alloc.workspace = true
tempfile.workspace    = true
walkdir.workspace     = true

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
exacl.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[target."cfg(unix)".dependencies]
rustix.workspace = true
uzers.workspace  = true

[target."cfg(windows)".dependencies]
fs_at.workspace               = true
renamore.workspace            = true
winapi-util.workspace         = true
windows-permissions.workspace = true
windows-sys.workspace         = true

[features]
default = ["cli"]
cli     = ["dep:clap"]

[lints]
workspace = true
