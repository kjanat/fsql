[package]
name                   = "fsql"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
description            = "SQL query and mutation engine over the filesystem"
repository.workspace   = true
license.workspace      = true

[dependencies]
globset             = "0.4.20"
regex               = "1.13.1"
rustix              = { version = "1.1.4", features = ["fs", "process"] }
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1.0.151"
sqlparser.workspace = true
tree-fucker         = { git = "https://github.com/kjanat/tree-fucker", version = "0.1.0" }
uzers               = "0.12.2"
