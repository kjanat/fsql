[workspace]
resolver = "3"
members  = ["crates/*", "editors/zed/", "vendor/sqlparser"]

[workspace.package]
version    = "0.1.1"
edition    = "2024"
repository = "https://github.com/kjanat/fsql"
license    = "MIT"

[workspace.dependencies]
fsql      = { path = "crates/fsql", version = "0.1.1" }
sqlparser = { package = "fsql-sqlparser", path = "vendor/sqlparser", version = "0.1.1" }

clap        = { version = "4.6.6", features = ["derive"] }
criterion   = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
exacl       = "0.13.0"
globset     = "0.4.20"
ignore      = "0.4.33"
jwalk       = "0.9.0"
libc        = "0.2.189"
regex       = "1.13.1"
rustix      = { version = "1.1.4", features = ["fs", "process"] }
serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = "1.0.151"
stats_alloc = "0.1.10"
sysinfo     = { version = "0.40.1", default-features = false, features = ["disk"] }
tempfile    = "3.27.0"
uzers       = "0.12.2"
walkdir     = "2.5.0"

fs_at               = "0.2.1"
renamore            = "0.3.2"
winapi-util         = "0.1.11"
windows-permissions = "0.2.4"
windows-sys         = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[workspace.dependencies.tree-fucker]
version = "0.1.0"

[workspace.lints]
clippy  = {}
rust    = { unsafe_code = "forbid" }
rustdoc = { all = "deny" }
