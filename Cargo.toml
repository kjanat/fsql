[workspace]
resolver = "3"
members  = ["crates/*", "editors/zed/", "vendor/sqlparser"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
readme     = "README.md"
repository = "https://github.com/kjanat/fsql"
license    = "MIT"

[workspace.dependencies]
fsql      = { path = "crates/fsql", version = "0.1.0" }
sqlparser = { package = "fsql-sqlparser", path = "vendor/sqlparser", version = "0.1.0" }

clap        = { version = "4.6.6", features = ["derive"] }
criterion   = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
globset     = "0.4.20"
ignore      = "0.4.33"
jwalk       = "0.9.0"
regex       = "1.13.1"
rustix      = { version = "1.1.4", features = ["fs", "process"] }
serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = "1.0.151"
stats_alloc = "0.1.10"
tempfile    = "3.27.0"
uzers       = "0.12.2"
walkdir     = "2.5.0"

[workspace.dependencies.tree-fucker]
version = "0.1.0"

[workspace.lints]
clippy  = {}
rust    = { unsafe_code = "forbid" }
rustdoc = { all = "deny" }
