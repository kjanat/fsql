[project]
name            = "fsql-benchmarks"
version         = "0.0.0"
requires-python = ">=3.15"
dependencies    = []

[project.scripts]
bench = "benchmarks.run:cli"

[build-system]
requires      = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
include        = ["benchmarks/**/*.py*"]
exclude        = ["./vendor/**"]
cache-dir      = ".venv/cache/ruff"
target-version = "py315"
preview        = true

[tool.ty]
environment = { python-version = "3.15" }

[tool.ty.src]
include = ["benchmarks/**/*.py*"]
exclude = ["./vendor/**"]

[tool.uv.build-backend]
module-name = "benchmarks"
module-root = ""
