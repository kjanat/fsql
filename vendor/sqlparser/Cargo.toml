[package]
name          = "sqlparser"
version       = "0.62.0"
authors       = ["Apache DataFusion <dev@datafusion.apache.org>"]
edition       = "2021"
description   = "Extensible SQL Lexer and Parser with support for ANSI SQL:2011"
documentation = "https://docs.rs/sqlparser/"
homepage      = "https://github.com/apache/datafusion-sqlparser-rs"
repository    = "https://github.com/apache/datafusion-sqlparser-rs"
license       = "Apache-2.0"
keywords      = ["ansi", "lexer", "parser", "sql"]
include       = [
  "Cargo.toml",
  "LICENSE.TXT",
  "src/**/*.rs",
]

[package.metadata.docs.rs]
# Document these features on docs.rs
features = ["serde", "visitor", "derive-dialect"]

[lib]
name = "sqlparser"
path = "src/lib.rs"

[[test]]
name              = "sqlparser_derive_dialect"
required-features = ["derive-dialect"]

[dependencies]
bigdecimal = { version = "0.4.1", features = ["serde"], optional = true }
log        = "0.4"
recursive  = { version = "0.1.1", optional = true }

serde            = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
# serde_json is only used in examples/cli, but we have to put it outside
# of dev-dependencies because of
# https://github.com/rust-lang/cargo/issues/1596
serde_json       = { version = "1.0", optional = true }
sqlparser_derive = { path = "derive", version = "0.5.0", optional = true }

[dev-dependencies]
matches           = "0.1"
pretty_assertions = "1"
simple_logger     = "5.0"

[features]
default              = ["recursive-protection", "std"]
derive-dialect       = ["sqlparser_derive"]
# Enable JSON output in the `cli` example:
json_example         = ["serde", "serde_json"]
recursive-protection = ["recursive", "std"]
std                  = []
visitor              = ["sqlparser_derive"]

[lints.rust]
unsafe_code = "forbid"
