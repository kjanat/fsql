<svg viewBox="0 0 64 64"
     color="#17221e"
     aria-labelledby="title desc" role="img"
     xmlns="http://www.w3.org/2000/svg">
	<title id="title">
		fsql
	</title>
	<desc id="desc">
		Stick figure pulling a file out of a tree. The pull is the dick. A reference to tree-fucker.
	</desc>
	<rect x="2" y="2" rx="14" width="60" height="60"
	      fill="#fafbf8" stroke="#cad2cd" stroke-width="1.5" />
	<g>
		<path d="M7 55.5H57"
		      fill="none" stroke="currentColor" stroke-width="3" opacity=".18" stroke-linecap="round" />

		<!-- tree -->
		<path d="M46 24v28" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
		<path d="M46 26c-8 0-11-5-11-9 5.5 0 9 1.2 11 4.5 2.2-5.4 6.4-7.5 12-7.5 0 5.4-3.2 9.6-12 12Z"
		      fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />

		<!-- file coming out of the canopy -->
		<path d="M31.5 18.5h10.2l2.4 2.4v7.6H31.5z"
		      fill="#fafbf8" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
		<path d="M41.7 18.5v2.5h2.4"
		      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
		<path d="M33.8 23.2h6.4M33.8 25.5h4.4"
		      fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />

		<!-- pull ticks -->
		<path d="M28.6 22.4l-3.4-1.4M29 26.2l-4.2.6"
		      fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />

		<!-- head -->
		<circle cx="16.5" cy="27" r="4.6" fill="none" stroke="currentColor" stroke-width="3" />
		<circle cx="15.1" cy="26.2" r=".75" fill="currentColor" />
		<circle cx="18" cy="26.2" r=".75" fill="currentColor" />
		<path d="M15 28.6c1 .8 2 .8 3 0"
		      fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />

		<!-- body -->
		<path d="M18.8 31.6c2.2 2.6 3 6 2.8 9.4"
		      fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" />
		<!-- left arm, hanging -->
		<path d="M17.2 33.2 14.2 43.4"
		      fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" />
		<!-- right arm, out and a bit down, like a normal arm -->
		<path d="M20.2 33.6 29.4 36.2"
		      fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" />

		<!-- legs -->
		<path d="M20.4 40.8l-5.4 11.4M22.6 41l4.4 11.2"
		      fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" />

		<!-- dick, same stroke as the rest, tip on the file -->
		<path d="M22.4 39.2 31.5 26"
		      fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" />
		<circle cx="31.8" cy="25.6" r="1.7" fill="currentColor" />
	</g>
</svg>
