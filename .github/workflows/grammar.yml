name: Tree-sitter

on:
  pull_request: null
  push: { branches: [master] }

permissions: { contents: read }

concurrency:
  group: grammar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grammar:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    cancel-timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: kjanat/runner@1f0e35b1e967fb26a2fd38667d3369d66e9d43b1 # master
      - name: Install workspace dependencies
        run: runner install -s grammar:generate
      - name: Verify generated parser
        run: git diff --exit-code -- tree-sitter-fsql/src
      - name: Corpus/highlighting + editor queries
        run: run -s grammar:test grammar:check
