name: Tree-sitter

on:
  pull_request:
  push: { branches: [master] }

permissions: { contents: read }

concurrency:
  group: grammar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grammar:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated parser
        run: |
          bun run grammar:generate
          git diff --exit-code -- tree-sitter-fsql/src
      - name: Corpus and highlighting tests
        run: bun run grammar:test
      - name: Query files and editor queries
        run: bun run grammar:check
